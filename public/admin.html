<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T12学习考核中心 - 管理员阅卷后台</title>
  <link rel="stylesheet" href="/styles.css?v=20260810-3">
</head>
<body>
  <div id="loginPage" class="start-layout">
    <main class="panel login-card">
      <h1>T12学习考核中心</h1>
      <p class="brand-sub">管理员阅卷后台</p>
      <p>请使用已授予后台权限的钉钉或飞书账号登录。</p>
      <div class="btn-row" style="margin-top:22px">
        <a class="btn primary" id="dingtalkAdminLogin" href="/auth/dingtalk/login?returnTo=/admin">使用钉钉登录</a>
        <a class="btn secondary" id="feishuAdminLogin" href="/auth/feishu/login?returnTo=/admin">使用飞书登录</a>
      </div>
      <div id="loginMsg" class="notice error hidden"></div>
    </main>
  </div>

  <div id="adminPage" class="hidden">
    <header class="topbar admin-topbar">
      <div class="topbar-inner admin-topbar-inner">
        <div class="brand">
          <div class="brand-title">T12学习考核中心</div>
          <div class="brand-sub">管理员阅卷后台</div>
        </div>
        <div class="btn-row admin-actions">
          <button class="btn secondary hidden" id="manageQuestionsBtn" type="button">题库</button>
          <button class="btn secondary hidden" id="manageAdminsBtn" type="button">管理员</button>
          <button class="btn secondary" id="refreshBtn" type="button">刷新</button>
          <button class="btn danger" id="logoutBtn" type="button">退出登录</button>
        </div>
      </div>
    </header>

    <main class="shell admin-layout">
      <aside class="panel admin-card" id="submissionPanel">
        <div class="toolbar">
          <div class="stats" role="group" aria-label="按批阅状态筛选答卷">
            <button class="stat stat-filter" type="button" data-status-filter="all" aria-controls="submissionList" aria-pressed="false">
              <span class="meta-label">总提交</span><strong id="statTotal">0</strong>
            </button>
            <button class="stat stat-filter" type="button" data-status-filter="pending" aria-controls="submissionList" aria-pressed="true">
              <span class="meta-label">待批阅</span><strong id="statPending">0</strong>
            </button>
            <button class="stat stat-filter" type="button" data-status-filter="graded" aria-controls="submissionList" aria-pressed="false">
              <span class="meta-label">已批阅</span><strong id="statGraded">0</strong>
            </button>
          </div>
          <input id="searchInput" placeholder="搜索考生姓名">
          <select id="statusFilter">
            <option value="pending" selected>待批阅</option>
            <option value="all">全部状态</option>
            <option value="graded">已批阅</option>
          </select>
        </div>
        <div id="submissionList" class="submission-list"></div>
      </aside>

      <section class="panel admin-card" id="detailPanel">
        <div class="empty-state">
          <div>
            <h2>请选择一份答卷</h2>
            <p>左侧列表会显示所有考生的每一次提交。</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="adminManagerDialog" class="admin-dialog">
    <div class="admin-dialog-shell">
      <div class="admin-dialog-head">
        <div>
          <h2>管理员</h2>
          <p class="brand-sub">钉钉、飞书用户与后台权限</p>
        </div>
        <button class="btn secondary compact-btn" id="closeAdminManagerBtn" type="button">关闭</button>
      </div>
      <input id="adminUserSearch" type="search" placeholder="搜索姓名、工号或部门">
      <div id="adminManagerMsg" class="notice hidden"></div>
      <div id="adminUserList" class="admin-user-list"></div>
      <section class="identity-merge-section">
        <div class="identity-merge-head">
          <div>
            <h3>同名账号合并</h3>
            <p class="brand-sub">仅列出分属钉钉和飞书的同名账号，合并前请核对工号与部门。</p>
          </div>
          <button class="btn secondary compact-btn" id="refreshMergeCandidatesBtn" type="button">重新检查</button>
        </div>
        <div id="identityMergeList" class="identity-merge-list"></div>
      </section>
    </div>
  </dialog>

  <dialog id="questionManagerDialog" class="admin-dialog question-dialog">
    <div class="admin-dialog-shell">
      <div class="admin-dialog-head">
        <div>
          <h2>题库维护</h2>
          <p class="brand-sub">手动录入与编辑试题</p>
        </div>
        <div class="admin-dialog-actions">
          <button class="btn primary compact-btn" id="newQuestionBtn" type="button">新增题目</button>
          <button class="btn secondary compact-btn" id="closeQuestionManagerBtn" type="button">关闭</button>
        </div>
      </div>
      <div class="question-manager-layout">
        <aside class="question-manager-list-panel">
          <div class="field question-exam-picker">
            <label for="questionExamFilter">分类</label>
            <select id="questionExamFilter"></select>
          </div>
          <div class="brand-sub question-count" id="questionCount"></div>
          <input id="questionSearch" type="search" placeholder="搜索当前试卷题目">
          <div id="questionList" class="question-manager-list"></div>
        </aside>
        <section id="questionEditor" class="question-editor">
          <div class="empty-state">请选择一道题目</div>
        </section>
      </div>
    </div>
  </dialog>

  <script src="/question-format.js?v=20260809-2"></script>
  <script src="/question-admin-model.js?v=20260810-1"></script>
  <script src="/admin.js?v=20260811-1"></script>
</body>
</html>
